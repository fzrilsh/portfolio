name: Build and push to production branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
          npm ci --legacy-peer-deps
          else
          npm install --legacy-peer-deps
          fi

      - name: Build
        run: npm run build

      - name: Detect build output directory
        id: detect
        run: |
          if [ -d build ]; then
            echo "BUILD_DIR=build" >> $GITHUB_ENV
          elif [ -d dist ]; then
            echo "BUILD_DIR=dist" >> $GITHUB_ENV
          else
            echo "❌ No build output directory found." >&2
            exit 1
          fi

      - name: Deploy build to branch 'production'
        env:
          BUILD_DIR: ${{ env.BUILD_DIR }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: "Deploy: build from ${{ github.sha }} to production"
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check if production branch exists remotely
          if git ls-remote --exit-code origin production; then
            echo "🟢 Production branch exists on remote."
            git fetch origin production
            git worktree add production-branch production
            cd production-branch
            git checkout production
          else
            echo "🟡 Production branch does not exist. Creating a new orphan branch."
            mkdir production-branch
            cd production-branch
            git init
            git checkout --orphan production
          fi

          # Clear old files
          rm -rf ./* || true

          # Copy new build output
          cp -r ../${BUILD_DIR}/* .

          # Optional for GitHub Pages
          touch .nojekyll

          git add --all
          if git diff --cached --quiet; then
            echo "✅ No changes to deploy."
            exit 0
          fi

          git commit -m "${COMMIT_MSG}"
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" HEAD:production --force